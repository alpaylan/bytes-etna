[package]

name = "bytes"
# When releasing to crates.io:
# - Update CHANGELOG.md.
# - Create "v1.x.y" git tag.
version = "1.11.1"
edition = "2021"
rust-version = "1.57"
license = "MIT"
authors = [
    "Carl Lerche <me@carllerche.com>",
    "Sean McArthur <sean@seanmonstar.com>",
]
description = "Types and traits for working with bytes"
repository = "https://github.com/tokio-rs/bytes"
readme = "README.md"
keywords = ["buffers", "zero-copy", "io"]
categories = ["network-programming", "data-structures"]
include = ["CHANGELOG.md", "LICENSE", "README.md", "SECURITY.md", "Cargo.toml", "src/**/*.rs", "tests/**/*.rs", "clippy.toml"]

[features]
default = ["std"]
std = []
etna = [
    "std",
    "dep:proptest",
    "dep:quickcheck_etna",
    "dep:crabcheck",
    "dep:hegeltest",
    "dep:rand_etna",
]

[dependencies]
serde = { version = "1.0.60", optional = true, default-features = false, features = ["alloc"] }
# Use portable-atomic crate to support platforms without atomic CAS.
# See "no_std support" section in readme for more information.
#
# Enable require-cas feature to provide a better error message if the end user forgets to use the cfg or feature.
extra-platforms = { package = "portable-atomic", version = "1.3", optional = true, default-features = false, features = ["require-cas"] }

# ETNA framework deps — optional, activated by the `etna` feature.
proptest = { version = "1.11.0", optional = true }
quickcheck_etna = { git = "https://github.com/alpaylan/quickcheck.git", branch = "master", package = "quickcheck", features = ["etna"], optional = true }
crabcheck = { git = "https://github.com/alpaylan/crabcheck.git", branch = "main", optional = true }
hegeltest = { version = "0.3.7", optional = true }
rand_etna = { package = "rand", version = "0.9", optional = true }

[dev-dependencies]
serde_test = "1.0"

[[bin]]
name = "etna"
path = "src/bin/etna.rs"
required-features = ["etna"]

[profile.release]
# Keep integer-overflow and shift-overflow checks in release builds so
# panic-on-overflow bugs (e.g. `sign_extend` with nbytes == 0) are
# observable by the etna runners, which build in --release mode.
overflow-checks = true

[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(loom)',
] }
